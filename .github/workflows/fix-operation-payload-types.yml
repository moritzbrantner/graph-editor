name: Fix operation payload type narrowing

on:
  push:
    branches:
      - harden/operation-payload-shapes
    paths:
      - .github/workflows/fix-operation-payload-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harden/operation-payload-shapes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Narrow validated graph document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/operation-log.ts')
          text = path.read_text()
          old = '''  for (const [index, node] of document.nodes.entries()) {\n    assertGraphEditorNodeShape(node, `${joinPath(path, "nodes")}.${index}`);\n  }\n  for (const [index, edge] of document.edges.entries()) {\n    assertGraphEditorEdgeShape(edge, `${joinPath(path, "edges")}.${index}`);\n  }'''
          new = '''  const graphDocument = document as unknown as GraphEditorDocument;\n  for (const [index, node] of graphDocument.nodes.entries()) {\n    assertGraphEditorNodeShape(node, `${joinPath(path, "nodes")}.${index}`);\n  }\n  for (const [index, edge] of graphDocument.edges.entries()) {\n    assertGraphEditorEdgeShape(edge, `${joinPath(path, "edges")}.${index}`);\n  }'''
          if old not in text:
              raise SystemExit('expected document iteration block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          bun run format
      - name: Commit fix
        run: |
          rm .github/workflows/fix-operation-payload-types.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/operation-log.ts .github/workflows/fix-operation-payload-types.yml
          git commit -m "fix: narrow validated operation documents"
          git push origin HEAD:harden/operation-payload-shapes
