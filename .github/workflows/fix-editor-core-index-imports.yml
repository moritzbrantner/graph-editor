name: Fix editor-core index compatibility

on:
  push:
    branches:
      - refactor/own-graph-vocabulary
    paths:
      - .github/workflows/fix-editor-core-index-imports.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out graph-editor PR head
        uses: actions/checkout@v6
        with:
          path: graph-editor
          ref: refactor/own-graph-vocabulary
          fetch-depth: 0
      - name: Check out narrowed editor-core head
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/editor-core
          path: editor-core
          ref: refactor/narrow-editor-kernel
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Remove obsolete editor-core graph-index imports
        working-directory: graph-editor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needle = 'import { createEditorGraphIndexes } from "@moritzbrantner/editor-core/indexes";\n'
          changed = []
          for path in sorted(Path("src").rglob("*.test.ts")):
              text = path.read_text()
              if needle not in text:
                  continue
              updated = text.replace(needle, "")
              path.write_text(updated)
              changed.append(str(path))
          if not changed:
              raise SystemExit("no obsolete editor-core graph-index imports found")
          print(f"removed obsolete import from {len(changed)} test files")
          for path in changed:
              print(path)
          PY
          if grep -R -n 'createEditorGraphIndexes' src; then
            echo 'obsolete editor-core graph-index reference remains' >&2
            exit 1
          fi
      - name: Verify against narrowed editor-core source
        working-directory: graph-editor
        env:
          EDITOR_CORE_SOURCE: ../editor-core
        run: bun run verify:source
      - name: Check diff hygiene
        working-directory: graph-editor
        run: git diff --check
      - name: Commit verified compatibility cleanup
        working-directory: graph-editor
        run: |
          rm .github/workflows/fix-editor-core-index-imports.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/fix-editor-core-index-imports.yml
          git commit -m "test: remove obsolete editor-core graph index imports"
          git push origin HEAD:refactor/own-graph-vocabulary
