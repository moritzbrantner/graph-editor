name: Format validation totality

on:
  push:
    branches:
      - harden/validation-totality
    paths:
      - .github/workflows/format-validation-totality.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harden/validation-totality
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatter output
        run: |
          rm .github/workflows/format-validation-totality.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/validation.ts src/index-tests/validation-totality.test.ts .github/workflows/format-validation-totality.yml
          git commit -m "style: format validation totality hardening"
          git push origin HEAD:harden/validation-totality
