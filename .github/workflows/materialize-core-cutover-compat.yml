name: Materialize editor-core cutover compatibility

on:
  push:
    branches:
      - fix/editor-core-opaque-runtime-compat
    paths:
      - .github/workflows/materialize-core-cutover-compat.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out graph branch
        uses: actions/checkout@v6
        with:
          ref: fix/editor-core-opaque-runtime-compat
          path: graph-editor
          fetch-depth: 0
      - name: Check out narrowed editor-core
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/editor-core
          ref: refactor/narrow-editor-kernel
          path: editor-core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Apply graph-owned cutover
        working-directory: graph-editor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          commands = Path('src/commands.ts')
          text = commands.read_text()
          old = '''  formatEditorShortcutLabel,\n  getEditorCommandIdFromKeyboardEvent,\n  isEditorEditableTarget,\n  type EditorHotkeyMap,\n'''
          new = '''  formatEditorShortcutLabel,\n  isEditorEditableTarget,\n  matchesEditorHotkey,\n  type EditorHotkeyMap,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  return getEditorCommandIdFromKeyboardEvent(\n    {\n      altKey: Boolean(event.altKey),\n      ctrlKey: Boolean(event.ctrlKey),\n      key: event.key,\n      metaKey: Boolean(event.metaKey),\n      shiftKey: Boolean(event.shiftKey),\n      target: event.target,\n    },\n    graphEditorCommandDefinitions,\n  );\n'''
          new = '''  const keyboardEvent = {\n    altKey: Boolean(event.altKey),\n    ctrlKey: Boolean(event.ctrlKey),\n    key: event.key,\n    metaKey: Boolean(event.metaKey),\n    shiftKey: Boolean(event.shiftKey),\n    target: event.target,\n  };\n  return (\n    graphEditorCommandDefinitions.find((command) =>\n      command.hotkeys?.some((hotkey) => matchesEditorHotkey(keyboardEvent, hotkey)),\n    )?.id ?? null\n  );\n'''
          assert text.count(old) == 1
          commands.write_text(text.replace(old, new))

          interaction = Path('src/interaction.ts')
          text = interaction.read_text()
          old = '''import {\n  createEditorInteractionSession,\n  type EditorInteractionState,\n} from "@moritzbrantner/editor-core/interaction";\n'''
          assert text.count(old) == 1
          text = text.replace(old, '')
          old = '''export type GraphEditorInteractionState =\n  | EditorInteractionState\n'''
          new = '''export type GraphEditorInteractionState =\n  | { kind: "idle" }\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  return createEditorInteractionSession(normalizeGraphEditorDocument(document));\n'''
          new = '''  const normalizedDocument = normalizeGraphEditorDocument(document);\n  return {\n    committedDocument: normalizedDocument,\n    previewDocument: normalizedDocument,\n    state: { kind: "idle" },\n  };\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          text = text.replace(
            'createEditorInteractionSession(session.committedDocument)',
            'createGraphEditorInteractionSession(session.committedDocument)',
          )
          text = text.replace(
            'createEditorInteractionSession(session.previewDocument)',
            'createGraphEditorInteractionSession(session.previewDocument)',
          )
          interaction.write_text(text)

          workbench = Path('src/react/workbench/index-core.tsx')
          text = workbench.read_text()
          old = '''  getEditorCommandIdFromKeyboardEvent,\n  isEditorEditableTarget,\n'''
          new = '''  isEditorEditableTarget,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = ''': getEditorCommandIdFromKeyboardEvent(event, commands);'''
          new = ''': (commands.find(\n              (command) =>\n                !command.disabled &&\n                command.hotkeys?.some((hotkey) => matchesEditorHotkey(event, hotkey)),\n            )?.id ?? null);'''
          assert text.count(old) == 1
          workbench.write_text(text.replace(old, new))

          lifecycle = Path('src/runtime/lifecycle.ts')
          text = lifecycle.read_text()
          marker = '''import type { GraphEditorRuntimeOptions, GraphEditorRuntimeState } from "./types";\n'''
          addition = '''import {\n  preserveEditorOperationRuntimeHistoryCompat,\n  replaceEditorOperationRuntimeCoreStateCompat,\n} from "./core-compat";\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, addition + marker)
          old = '''  const nextState = applyEditorOperation(state, resolvedOperation, options);\n  const historyEnabled =\n    !runtimeOptions.disableHistory && operation.metadata?.graphEditor?.history !== false;\n\n  if (!historyEnabled) {\n    nextState.operationHistory = state.operationHistory;\n    nextState.canUndo = state.operationHistory.undoStack.length > 0;\n    nextState.canRedo = state.operationHistory.redoStack.length > 0;\n  }\n\n  return withGraphEditorRuntimeState(nextState, runtimeOptions);\n'''
          new = '''  const historyEnabled =\n    !runtimeOptions.disableHistory && operation.metadata?.graphEditor?.history !== false;\n  const applyOptions: ApplyEditorOperationOptions & { recordHistory?: boolean } = {\n    ...options,\n    recordHistory: historyEnabled,\n  };\n  const appliedState = applyEditorOperation(state, resolvedOperation, applyOptions);\n  const nextState = historyEnabled\n    ? appliedState\n    : preserveEditorOperationRuntimeHistoryCompat(state, appliedState);\n\n  return withGraphEditorRuntimeState(nextState, runtimeOptions);\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  return withGraphEditorRuntimeState(\n    {\n      ...state,\n      issues: [],\n      lastMergeKey: null,\n      operationHistory: { undoStack: [], redoStack: [] },\n      runtime,\n    },\n    runtimeOptions,\n  );\n'''
          new = '''  return withGraphEditorRuntimeState(\n    replaceEditorOperationRuntimeCoreStateCompat(state, runtime, {\n      clearOperationHistory: true,\n    }),\n    runtimeOptions,\n  );\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  return withGraphEditorRuntimeState(\n    {\n      ...state,\n      runtime,\n    },\n    getGraphEditorRuntimeStateOptions(state),\n  );\n'''
          new = '''  return withGraphEditorRuntimeState(\n    replaceEditorOperationRuntimeCoreStateCompat(state, runtime),\n    getGraphEditorRuntimeStateOptions(state),\n  );\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  return withGraphEditorRuntimeState(\n    {\n      ...state,\n      runtime: markEditorRuntimeSaved(state.runtime),\n    },\n    getGraphEditorRuntimeStateOptions(state),\n  );\n'''
          new = '''  return withGraphEditorRuntimeState(\n    replaceEditorOperationRuntimeCoreStateCompat(state, markEditorRuntimeSaved(state.runtime)),\n    getGraphEditorRuntimeStateOptions(state),\n  );\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          start = text.index('export function replaceGraphEditorRuntimeCoreState<')
          new_tail = '''export function replaceGraphEditorRuntimeCoreState<\n  TNodeData = Record<string, unknown>,\n  TEdgeData = Record<string, unknown>,\n  TPortType = unknown,\n>(\n  state: GraphEditorRuntimeState<TNodeData, TEdgeData, TPortType>,\n  runtime: EditorRuntimeState<\n    GraphEditorDocument<TNodeData, TEdgeData, TPortType>,\n    GraphEditorSelectionState\n  >,\n  options: {\n    clearOperationHistory?: boolean;\n  } = {},\n): GraphEditorRuntimeState<TNodeData, TEdgeData, TPortType> {\n  return withGraphEditorRuntimeState(\n    replaceEditorOperationRuntimeCoreStateCompat(state, runtime, options),\n    getGraphEditorRuntimeStateOptions(state),\n  );\n}\n'''
          lifecycle.write_text(text[:start] + new_tail)

          state = Path('src/runtime/state.ts')
          text = state.read_text()
          marker = '''import type {\n  GraphEditorRuntimeOptions,\n'''
          addition = '''import { replaceEditorOperationRuntimeCoreStateCompat } from "./core-compat";\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, addition + marker)
          old = '''  const document = state.runtime.document;\n  const selection = normalizeGraphEditorSelection(\n    document,\n    state.runtime.selection ?? { nodeIds: [], edgeIds: [] },\n  );\n  if (selection !== state.runtime.selection) {\n    state.runtime = setEditorRuntimeSelection(state.runtime, selection);\n  }\n  const diagnostics = validateGraphEditorDocument(document, options.validationOptions);\n'''
          new = '''  const document = state.runtime.document;\n  const selection = normalizeGraphEditorSelection(\n    document,\n    state.runtime.selection ?? { nodeIds: [], edgeIds: [] },\n  );\n  const coreState =\n    selection === state.runtime.selection\n      ? state\n      : replaceEditorOperationRuntimeCoreStateCompat(\n          state,\n          setEditorRuntimeSelection(state.runtime, selection),\n        );\n  const diagnostics = validateGraphEditorDocument(document, options.validationOptions);\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''  const graphState = Object.assign(state, {\n'''
          new = '''  const graphState = Object.assign(coreState, {\n'''
          assert text.count(old) == 1
          state.write_text(text.replace(old, new))

          stale_index_import = 'import { createEditorGraphIndexes } from "@moritzbrantner/editor-core/indexes";\n'
          changed_tests = 0
          for test in Path('src/index-tests').glob('*.test.ts'):
            text = test.read_text()
            if stale_index_import in text:
              text = text.replace(stale_index_import, '')
              test.write_text(text)
              changed_tests += 1
          assert changed_tests > 0, 'expected stale graph index test imports'
          print(f'removed stale graph index import from {changed_tests} split tests')
          PY

          cat > src/runtime/core-compat.ts <<'EOF'
          import * as editorOperations from "@moritzbrantner/editor-core/operations";
          import type { EditorOperationRuntimeState } from "@moritzbrantner/editor-core/operations";
          import type { EditorRuntimeState } from "@moritzbrantner/editor-core/runtime";

          type ReplaceEditorOperationRuntimeCoreState = <TDocument, TSelection = unknown>(
            state: EditorOperationRuntimeState<TDocument, TSelection>,
            runtime: EditorRuntimeState<TDocument, TSelection>,
            options?: { clearOperationHistory?: boolean },
          ) => EditorOperationRuntimeState<TDocument, TSelection>;

          function getCoreStateReplacement() {
            return (
              editorOperations as unknown as {
                replaceEditorOperationRuntimeCoreState?: ReplaceEditorOperationRuntimeCoreState;
              }
            ).replaceEditorOperationRuntimeCoreState;
          }

          export function replaceEditorOperationRuntimeCoreStateCompat<
            TDocument,
            TSelection = unknown,
          >(
            state: EditorOperationRuntimeState<TDocument, TSelection>,
            runtime: EditorRuntimeState<TDocument, TSelection>,
            options: { clearOperationHistory?: boolean } = {},
          ): EditorOperationRuntimeState<TDocument, TSelection> {
            const replaceCoreState = getCoreStateReplacement();
            if (replaceCoreState) {
              return replaceCoreState(state, runtime, options);
            }

            const operationHistory = options.clearOperationHistory
              ? { undoStack: [], redoStack: [] }
              : state.operationHistory;
            const mutable = state as unknown as {
              runtime: EditorRuntimeState<TDocument, TSelection>;
              operationHistory: EditorOperationRuntimeState<TDocument, TSelection>["operationHistory"];
              canUndo: boolean;
              canRedo: boolean;
              issues: EditorOperationRuntimeState<TDocument, TSelection>["issues"];
              lastMergeKey: string | null;
            };
            mutable.runtime = runtime;
            mutable.operationHistory = operationHistory;
            mutable.canUndo = operationHistory.undoStack.length > 0;
            mutable.canRedo = operationHistory.redoStack.length > 0;
            mutable.issues = [];
            mutable.lastMergeKey = options.clearOperationHistory ? null : state.lastMergeKey;
            return state;
          }

          export function preserveEditorOperationRuntimeHistoryCompat<
            TDocument,
            TSelection = unknown,
          >(
            previous: EditorOperationRuntimeState<TDocument, TSelection>,
            next: EditorOperationRuntimeState<TDocument, TSelection>,
          ): EditorOperationRuntimeState<TDocument, TSelection> {
            if (getCoreStateReplacement()) {
              return next;
            }

            const mutable = next as unknown as {
              operationHistory: EditorOperationRuntimeState<TDocument, TSelection>["operationHistory"];
              canUndo: boolean;
              canRedo: boolean;
            };
            mutable.operationHistory = previous.operationHistory;
            mutable.canUndo = previous.operationHistory.undoStack.length > 0;
            mutable.canRedo = previous.operationHistory.redoStack.length > 0;
            return next;
          }
          EOF
      - name: Install graph dependencies
        working-directory: graph-editor
        run: bun install --frozen-lockfile
      - name: Format source compatibility slice
        working-directory: graph-editor
        run: bun run format
      - name: Prepare exact core source
        working-directory: graph-editor
        env:
          EDITOR_CORE_SOURCE: ${{ github.workspace }}/editor-core
        run: bun run source:prepare
      - name: Verify source smoke and type boundaries
        working-directory: graph-editor
        run: |
          bun run source:smoke
          bun run format:check
          bun run lint
          bun run check:editor-core
          bun run check-types
          bun run check-types:tests
      - name: Commit materialized source changes
        working-directory: graph-editor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "fix: preserve graph behavior across opaque core runtime"
          git push origin HEAD:fix/editor-core-opaque-runtime-compat
