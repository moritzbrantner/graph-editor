name: Performance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: graph-editor-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-validation:
    name: Performance Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: latest
      install_command: bun install --frozen-lockfile
      build_command: bun run build
      benchmark_command: bun run bench
      timeout_minutes: 60
