name: Repair Playwright lockfile

on:
  push:
    branches:
      - fix/green-baseline-playwright
    paths:
      - package.json
      - .github/workflows/repair-playwright-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/green-baseline-playwright
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Regenerate lockfile
        run: bun install
      - name: Verify Playwright core alignment
        shell: bash
        run: |
          grep -q '"playwright-core": "1.62.1"' package.json
          grep -q 'playwright-core@1.62.1' bun.lock
          if grep -q 'playwright-core@1.61.0' bun.lock; then
            echo 'stale Playwright core 1.61.0 remains in lockfile' >&2
            exit 1
          fi
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already aligned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'fix: regenerate Playwright lockfile'
          git push origin HEAD:fix/green-baseline-playwright
