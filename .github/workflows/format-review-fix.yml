name: Format import-policy repair

on:
  push:
    branches:
      - fix/moenarch-source-first

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-editor-core-consumption.mjs
          if git diff --cached --quiet; then
            echo "Already formatted."
          else
            git commit -m "style: format editor-core import guard"
            git push
          fi
