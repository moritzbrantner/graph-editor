name: Repair validation baseline

on:
  push:
    branches:
      - fix/green-baseline-playwright
    paths:
      - .github/workflows/repair-validation-baseline.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/green-baseline-playwright
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Repair stale validation baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package.setdefault('scripts', {})
          scripts['source:prepare'] = 'node scripts/source-deps.mjs prepare'
          scripts['source:restore'] = 'node scripts/source-deps.mjs restore'
          scripts['source:smoke'] = 'node scripts/source-deps.mjs smoke'
          scripts['source:status'] = 'node scripts/source-deps.mjs status'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          canvas_path = Path('src/react/graph-canvas/index-core.tsx')
          canvas = canvas_path.read_text()
          for name in ('GraphCanvasNodeProps', 'GraphCanvasToolbarProps', 'GraphCanvasMiniMapProps'):
              marker = f'  {name},\n'
              if marker not in canvas:
                  raise SystemExit(f'missing expected duplicate export {name}')
              canvas = canvas.replace(marker, '', 1)
          canvas_path.write_text(canvas)

          import_fixes = {
              Path('src/react/workbench/components/GraphWorkbenchCommandButton.tsx'): (
                  '../workbench-commands',
                  '../../workbench-commands',
              ),
              Path('src/react/workbench/components/GraphWorkbenchPaletteGroup.tsx'): (
                  '../palette-model',
                  '../../palette-model',
              ),
          }
          for path, (old, new) in import_fixes.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected stale import {old} in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

          bun x oxfmt \
            package.json \
            src/react/graph-canvas/index-core.tsx \
            src/react/nodes/components/GraphInputOnlyNode.tsx \
            src/react/nodes/components/GraphNodeInlinePort.tsx \
            src/react/nodes/components/GraphNodeMinimizeButton.tsx \
            src/react/nodes/utils.ts \
            src/react/workbench/components/GraphWorkbenchCommandButton.tsx \
            src/react/workbench/components/GraphWorkbenchPaletteGroup.tsx \
            src/react/workbench/index-core.tsx

          git diff --check
      - name: Verify repaired local gates
        shell: bash
        run: |
          bun run format:check
          bun run check-types:tests
          bun run build
      - name: Commit baseline repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/react
          git commit -m 'fix: restore graph-editor validation baseline'
          git push origin HEAD:fix/green-baseline-playwright
