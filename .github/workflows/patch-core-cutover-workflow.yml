name: Patch editor-core cutover workflow

on:
  push:
    branches:
      - fix/editor-core-opaque-runtime-compat
    paths:
      - .github/workflows/patch-core-cutover-workflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/editor-core-opaque-runtime-compat
          fetch-depth: 0
      - name: Insert formatting gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-core-cutover-compat.yml')
          text = path.read_text()
          marker = '      - name: Verify exact narrowed core source\n'
          insert = '      - name: Format compatibility slice\n        working-directory: graph-editor\n        run: bun run format\n'
          assert text.count(marker) == 1
          assert insert not in text
          path.write_text(text.replace(marker, insert + marker))
          PY
      - name: Commit workflow repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/patch-core-cutover-workflow.yml
          git add .github/workflows/apply-core-cutover-compat.yml
          git commit -m "ci: format graph cutover compatibility slice"
          git push origin HEAD:fix/editor-core-opaque-runtime-compat
