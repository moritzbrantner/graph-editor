name: Format patch root hardening

on:
  push:
    branches:
      - harden/patch-root-boundary
    paths:
      - .github/workflows/format-patch-root-hardening.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harden/patch-root-boundary
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatter output
        run: |
          rm .github/workflows/format-patch-root-hardening.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/document.ts src/runtime/state.ts src/index-tests/patch-root-hardening.test.ts .github/workflows/format-patch-root-hardening.yml
          git commit -m "style: format patch root hardening"
          git push origin HEAD:harden/patch-root-boundary
