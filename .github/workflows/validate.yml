name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      performance: ${{ steps.scope.outputs.performance }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import json
          import os
          import re
          import subprocess

          # GitHub path filters: '*' stays within a segment; '**' crosses segments.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          required = False
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              paths = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]]).decode().split("\0")
              patterns = ['src/**', 'tests/**', 'bench/**', 'benchmark/**', 'package.json', 'bun.lock', 'vite.config.*', '.github/workflows/performance.yml']
              required = any(matches(path, pattern) for path in paths for pattern in patterns)
          skipped = [] if required else ["performance-validation"]
          if os.environ["GITHUB_EVENT_NAME"] != "pull_request":
              skipped.append("source-validation")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"performance={str(required).lower()}", file=output)
              print(f"allow-skipped={json.dumps(skipped)}", file=output)

  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.4.3"
      install_command: bun install --frozen-lockfile
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check:editor-core && bun run check-types && bun run check-types:tests
      build_command: bun run build
      test_command: bun run test && bun run smoke:package && bun run pack:check && bun run verify:git-install
      timeout_minutes: 45

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright
        run: bun run test:e2e

  actionlint:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  source-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/source-validation.yml

  performance-validation:
    needs: validation-scope
    if: needs.validation-scope.outputs.performance == 'true'
    uses: ./.github/workflows/performance.yml
    secrets: inherit

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: always()
    needs:
      [
        "fast-validation",
        "e2e",
        "actionlint",
        "validation-scope",
        "source-validation",
        "performance-validation",
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["fast-validation", "e2e", "actionlint", "validation-scope", "source-validation", "performance-validation"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
