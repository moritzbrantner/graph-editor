name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check:editor-core && bun run check-types && bun run check-types:tests
      build_command: bun run build
      test_command: bun run test && bun run smoke:package && bun run pack:check
      timeout_minutes: 45
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Configure GitHub Packages auth
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -n "$GH_PACKAGES_TOKEN" ]; then
            echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> ~/.npmrc
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright
        run: bun run test:e2e

  actionlint:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  exact-editor-core-compatibility:
    name: Exact editor-core compatibility cleanup
    if: (github.event_name == 'push' && github.ref == 'refs/heads/refactor/own-graph-vocabulary') || (github.event_name == 'pull_request' && github.head_ref == 'refactor/own-graph-vocabulary')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out graph-editor PR head
        uses: actions/checkout@v6
        with:
          ref: refactor/own-graph-vocabulary
          fetch-depth: 0
      - name: Check out narrowed editor-core PR head
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/editor-core
          ref: refactor/narrow-editor-kernel
          path: editor-core
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Configure GitHub Packages auth
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -n "$GH_PACKAGES_TOKEN" ]; then
            echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> ~/.npmrc
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Remove obsolete editor-core graph-index imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needle = 'import { createEditorGraphIndexes } from "@moritzbrantner/editor-core/indexes";\n'
          changed = []
          for path in sorted(Path("src/index-tests").glob("*.test.ts")):
              text = path.read_text()
              if needle in text:
                  path.write_text(text.replace(needle, "", 1))
                  changed.append(path)
          if len(changed) != 24:
              raise SystemExit(f"expected 24 obsolete imports, removed {len(changed)}")
          print("removed obsolete import from 24 split tests")
          PY
          rm -f .github/workflows/fix-editor-core-index-imports.yml
      - name: Verify against exact narrowed editor-core source
        env:
          EDITOR_CORE_SOURCE: ${{ github.workspace }}/editor-core
        run: bun run verify:source
      - name: Restore normal workflow and commit verified cleanup
        run: |
          git show ec30af6c8b9888edee72f6ff838473794852bd72:.github/workflows/validate.yml > .github/workflows/validate.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index-tests .github/workflows/validate.yml .github/workflows/fix-editor-core-index-imports.yml
          git commit -m "test: remove obsolete editor-core graph index imports"
          git push origin HEAD:refactor/own-graph-vocabulary
