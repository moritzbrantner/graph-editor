name: Format port document boundary

on:
  push:
    branches:
      - harden/port-document-boundary
    paths:
      - .github/workflows/format-port-boundary.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harden/port-document-boundary
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatter output
        run: |
          rm .github/workflows/format-port-boundary.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/types.ts src/core/validation.ts src/core/document.ts src/index-tests/port-document-hardening.test.ts .github/workflows/format-port-boundary.yml
          git commit -m "style: format port document hardening"
          git push origin HEAD:harden/port-document-boundary
