name: Format document parse paths

on:
  push:
    branches:
      - harden/document-parse-paths
    paths:
      - .github/workflows/format-document-parse-paths.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: harden/document-parse-paths
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatter output
        run: |
          rm .github/workflows/format-document-parse-paths.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core/document-io.ts src/index-tests/document-parse-paths.test.ts .github/workflows/format-document-parse-paths.yml
          git commit -m "style: format document parse path hardening"
          git push origin HEAD:harden/document-parse-paths
